# Run through deploy/deploy.sh, which starts this as a blue or green compose
# project and sets HOST_PORT for it.
services:
  backend:
    build: .
    env_file:
      - .env.prod
    environment:
      ITEMS_SNAPSHOT_PATH: /data/inventory-snapshots/items-snapshot.json
    volumes:
      - inventory-snapshots:/data/inventory-snapshots
    ports:
      - '127.0.0.1:${HOST_PORT:?run via deploy/deploy.sh}:3010'
    restart: always
volumes:
  inventory-snapshots:
    name: hyglobalcopcu_inventory_snapshots
